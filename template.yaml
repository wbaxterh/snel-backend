AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS SAM template for deploying Node.js/Express API to Lambda

Parameters:
  BlockfrostApiKey:
    Type: String
    Description: "API Key for Blockfrost API"
  DiscordBotToken:
    Type: String
    Description: "Token for the Discord bot"
  DiscordChannelId:
    Type: String
    Description: "Channel ID for Discord notifications"
  BlockfrostAuthToken:
    Type: String
    Description: "Auth token for Blockfrost webhooks"
  BlockfrostWebhookIdentifier:
    Type: String
    Description: "Webhook identifier for Blockfrost"

Resources:
  SnelApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: server.handler
      Runtime: nodejs18.x
      CodeUri: ./src # Path to your backend code
      MemorySize: 1024
      Timeout: 120
      Environment:
        Variables:
          BLOCKFROST_API_KEY: !Ref BlockfrostApiKey
          DISCORD_BOT_TOKEN: !Ref DiscordBotToken
          DISCORD_CHANNEL_ID: !Ref DiscordChannelId
          BLOCKFROST_AUTH_TOKEN: !Ref BlockfrostAuthToken
          BLOCKFROST_WEBHOOK_IDENTIFIER: !Ref BlockfrostWebhookIdentifier
      Events:
        ApiRoot:
          Type: Api
          Properties:
            RestApiId: !Ref SnelApi
            Path: /
            Method: ANY
        ApiHolders:
          Type: Api
          Properties:
            RestApiId: !Ref SnelApi
            Path: /api/snel-holders
            Method: GET
        ApiMarketCap:
          Type: Api
          Properties:
            RestApiId: !Ref SnelApi
            Path: /api/snel-marketcap
            Method: GET
        ApiWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref SnelApi
            Path: /api/webhook
            Method: POST

  SnelApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowOrigin: "'https://snel.fun'"

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL for the Snel API"
    Value: !Sub "https://${SnelApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
